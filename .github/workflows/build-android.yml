name: Build Android

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            platform/android/**/*.gradle
            platform/android/gradle/wrapper/gradle-wrapper.properties
      - name: Install pinned Android SDK components
        run: |
          test -n "$ANDROID_HOME"
          # yes may exit on SIGPIPE once sdkmanager has accepted the licences.
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          set -o pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install             'platforms;android-34' 'build-tools;34.0.0'             'ndk;26.3.11579264' 'cmake;3.22.1'
      - name: Build installable debug APK
        run: |
          chmod +x platform/android/gradlew
          sh platform/android/build.sh debug
      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: fruit-ninja-android-debug
          path: dist/android/fruit-ninja-debug.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
